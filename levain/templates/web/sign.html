<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Levain · sign</title>
<link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="pair-body">
  <main class="pair-card" id="sheet" aria-live="polite">
    <div class="pair-brand"><span class="pair-dot"></span>Levain</div>
    <h1 id="sheet-title">Sign request</h1>
    <p id="sheet-msg">Reading the sign request…</p>
    <div id="sheet-body"></div>
    <!-- #sheet-decide groups the controls so a wide screen can hold them as one column (#sheet-decide stretches the grid rows, #sheet-decide-in sticks inside it); below 800px both are display: contents (dashboard.css) -->
    <div id="sheet-decide"><div id="sheet-decide-in">
      <div id="sheet-actions" class="pair-actions" hidden></div>
      <p id="sheet-note"></p>
      <p id="sheet-enrol"><a id="sheet-enrol-link" class="sign-enrol-link" href="/enrol">Make a passkey on this device</a></p>
      <p id="sheet-back"><a id="sheet-home" href="/">Back to the cockpit</a></p>
    </div></div>
  </main>
  <!-- The sheet's code is its own served file: this page's CSP is script-src 'self', no inline script. -->
  <script src="/sw_open.js"></script>
  <script src="/card_format.js"></script>
  <script src="/envelope_form.js"></script>
  <script src="/mic.js"></script>
  <script src="/sign.js"></script>
</body>
</html>
