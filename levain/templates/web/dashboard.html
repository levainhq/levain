<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Levain · substrate control</title>
<link rel="stylesheet" href="/dashboard.css" />
<!-- OS-4: the Home Screen web app a phone turns pings on in -->
<link rel="manifest" href="/app.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Levain" />
<!-- cockpit_view.js loads here, not at the end of the body: its first act is to set the chosen theme, so a stored light theme never
     flashes dark (the CSP forbids an inline script). Everything else in it runs when the document is ready. -->
<script src="/cockpit_view.js"></script>
<script src="/legacy_phone_link.js"></script>
<script src="/sw_open.js"></script>
<script src="/pwa_resume.js"></script>
<script src="/pwa_update.js"></script>
<script src="/topology_view.js"></script>
<script src="/agents_view.js"></script>
</head>
<body class="ia">
  <div class="deck">
    <!-- The page: the masthead (brand, the action buttons, readout, theme), the places bar, then the KE regions (hidden until the
         manifest declares hero / widgets). The masthead never moves. The hero is the now band (clock, date, the state line, the wrap
         line) with the sky as a card under it. The state line (#state, below) moves into the band while the KE page is up.
         There is no Modes bar: the places bar is the one way between places (levain#141). -->
    <header class="masthead frame">
      <div class="brand">
        <div class="wordmark">Levain</div>
      </div>
      <div class="readout">
        <div class="unit">
          <span class="unit-label">Unit</span>
          <span class="entity" id="entity">—</span>
        </div>
        <div class="indicators">
          <span class="ia-actions" role="group" aria-label="Actions">
            <button type="button" class="ia-act" data-phone-jump="drop" aria-label="Drop to the desk" title="Drop to the desk"><span class="ia-ico" aria-hidden="true">&#9998;</span><span class="ia-lbl">Drop</span></button>
            <button type="button" class="ia-act" data-phone-jump="grants" aria-label="Grants" title="Grants"><span class="ia-ico" aria-hidden="true">&#9919;</span><span class="ia-lbl">Grants</span></button>
            <button type="button" class="ia-act" data-phone-jump="notifications" aria-haspopup="dialog" aria-label="Notifications" title="Notifications"><span class="ia-ico" aria-hidden="true">&#9673;</span><span class="ia-lbl">Notifications</span><span class="ck-tabcount ck-pill" data-nc-unread hidden></span></button>
          </span>
          <span class="stamp" id="stamp"></span>
          <button id="presencebtn" class="pr-chip" type="button" hidden aria-haspopup="dialog" aria-expanded="false" aria-controls="pr-sheet" aria-label="Presence"><span class="pr-dot" aria-hidden="true"></span><span class="pr-chip-t"></span></button>
          <button id="refresh" type="button">Sync</button>
          <button id="jumpbtn" type="button">Jump<kbd>⌘K</kbd></button>
        </div>
        <div class="themesw" role="group" aria-label="Theme">
          <button type="button" data-theme-set="system" aria-pressed="false" aria-label="Follow the system theme" title="System">&#9680;</button>
          <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">&#9790;</button>
          <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Light theme" title="Light">&#9788;</button>
        </div>
      </div>
    </header>
    <!-- The places bar: places only, at every width. Its buttons drive the page through the hidden drivers below (dashboard_places.js);
         the Needs count rides Home so it shows from every place. Drop, Grants and Notifications are the masthead's buttons, not places. -->
    <nav class="ck-phonetabs ia-places" id="ck-phonetabs" aria-label="Places">
      <button type="button" data-ia-place-btn="home" title="Home (key 1)" aria-keyshortcuts="1">Home<span class="ia-needs"><span class="ia-needs-w">Needs</span><span class="ck-tabcount ck-needs-count" data-nc-needs hidden></span></span></button>
      <button type="button" data-ia-place-btn="desk" title="Desk (key 2)" aria-keyshortcuts="2">Desk</button>
      <button type="button" data-ia-place-btn="room" title="Room (key 3)" aria-keyshortcuts="3">Room</button>
      <button type="button" data-ia-place-btn="memory" title="Memory (key 4)" aria-keyshortcuts="4">Memory</button>
      <button type="button" data-ia-place-btn="settings" title="Settings (key 5)" aria-keyshortcuts="5">Settings</button>
    </nav>
    <!-- The places bar drives the page's own wiring through these (data-mode-tab: cockpit_view.js; data-phone-jump: dashboard_boot.js). -->
    <div class="ia-drivers" hidden>
      <button type="button" data-mode-tab="board" data-ia-mode="board" tabindex="-1">board</button>
      <button type="button" data-mode-tab="memory" data-ia-mode="memory" tabindex="-1">memory</button>
      <button type="button" data-phone-jump="desk" data-ia-jump="desk" tabindex="-1">desk</button>
      <button type="button" data-phone-jump="room" data-ia-jump="room" tabindex="-1">room</button>
    </div>
    <section class="hero" id="ck-hero" data-ck-region="hero" hidden>
      <div class="band frame" id="ck-band">
        <div class="when" id="ck-when"></div>
        <div class="band-state" id="ck-state-slot"></div>
        <div class="band-meta" id="ck-wrapline"></div>
      </div>
      <div class="skycol frame" id="ck-skycol">
        <div class="ck-mctl" id="ck-mctl" role="group" aria-label="Machine view controls">
          <button id="calmbtn" type="button" data-calm-toggle aria-pressed="false" aria-label="Calm off" title="Calm off">Calm off</button>
          <div id="ck-jarbox" class="ck-jarbox"></div>
        </div>
        <div class="skycard" id="ck-skycard">
          <div class="ck-hlens" id="ck-hlens" hidden></div>
          <div id="ck-sky"></div>
          <div class="ck-legend" id="ck-legend" hidden></div>
        </div>
      </div>
    </section>
    <section class="ck-needs frame" id="ck-needs" aria-label="Needs you" hidden></section>
    <!-- The notes sit before the drop in the document, as Home draws them (needs, notes, the Desk head, the drop), so Tab walks the page top to bottom. -->
    <section class="ck-notes frame" id="ck-notes" aria-label="Notes from agents" hidden></section>
    <!-- The desk drop (filled by renderDropHero; never replaced by an install): dashboard.css places it by place; Memory does not draw it (the Drop button goes Home first, then to the box). -->
    <section class="ck-drop frame" id="ck-drop" aria-label="Drop to the desk" hidden></section>
    <div class="ck-secthead frame" id="ck-h-widgets" hidden><h3>At a glance</h3><span>one answer each</span></div>
    <section class="ck-widgets frame" id="ck-widgets" data-ck-region="widgets" hidden></section>
    <p class="stateline frame" id="state" hidden></p>
    <p class="sub frame" id="store" data-cold>connecting…</p>
    <!-- The board's panels; dashboard.css places them by place. Keys 1-4 are the places keys (dashboard_places.js), ignored while typing. -->
    <main class="frame">
      <!-- levain#141 polish (fix4): the Settings place's first section. It holds the entity's name and the rename control (the same
           wireEntityName the masthead uses), so the rename is reachable where the masthead hides the name (it repeats the wordmark).
           Drawn on Settings only, and only while it holds the control (dashboard_core.js syncCockpitSection). It is not a .dev-zone
           (the devices script's own sections are, and tests and code look the first one up); dashboard.css gives it the same rules. -->
      <section class="ck-thiscockpit" id="ck-thiscockpit" data-zone="cockpit" aria-labelledby="ck-thiscockpit-t" hidden>
        <div class="zone-head"><h2 class="zone-title" id="ck-thiscockpit-t">This cockpit</h2><span class="zone-gloss">its name, as every device shows it</span></div>
        <div class="unit ck-unit"><span class="unit-label">Name</span><span class="entity" id="ck-entity">—</span></div>
      </section>
      <div class="grid" id="board"></div>
    </main>
  </div>

<!-- The canonical render core (shared, transport-agnostic) + this surface's thin
     fetch lifecycle shim. Both served by `levain serve` from package data — no
     CDN, no framework, runs offline. -->
<script src="/card_format.js"></script>
<script src="/dashboard_core.js"></script>
<script src="/sky.js"></script>
<script src="/pwa_install.js"></script>
<script src="/pair_card.js"></script>
<script src="/dashboard_boot.js"></script>
<script src="/cockpit_stream.js"></script>
<script src="/dashboard_chat.js"></script>
<script src="/devices_panel.js"></script>
<script src="/voice_icons.js"></script>
<script src="/voice.js"></script>
<script src="/card_voice.js"></script>
<script src="/mic.js"></script>
<script src="/thread_view.js"></script>
<script src="/room_view.js"></script>
<script src="/desk_tab_view.js"></script>
<script src="/board_view.js"></script>
<script src="/dashboard_places.js"></script>
</body>
</html>
