<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Levain · substrate control</title>
<link rel="stylesheet" href="/dashboard.css" />
<!-- OS-4: the Home Screen web app a phone turns pings on in -->
<link rel="manifest" href="/app.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- cockpit_view.js loads here, not at the end of the body: its first act is to set the chosen theme, so a stored light theme never
     flashes dark (the CSP forbids an inline script). Everything else in it runs when the document is ready. -->
<script src="/cockpit_view.js"></script>
<script src="/legacy_phone_link.js"></script>
<script src="/topology_view.js"></script>
</head>
<body>
  <div class="deck">
    <!-- The page: masthead (brand, the Needs pill, readout, theme, the settings avatar), then the KE regions (hidden until the manifest declares
         hero / brief / widgets). The masthead never moves. The hero is the now band (clock, date, the state line, the wrap line)
         with the sky as a card under it. The state line (#state, below) moves into the band while the KE page is up. -->
    <header class="masthead frame">
      <div class="brand">
        <div class="wordmark">Levain</div>
        <div class="model">your partner's memory, from outside the session</div>
      </div>
      <div class="readout">
        <div class="unit">
          <span class="unit-label">Unit</span>
          <span class="entity" id="entity">—</span>
        </div>
        <div class="jar" id="jar" hidden></div>
        <button id="ck-needs-pill" class="ck-needs-pill" type="button" hidden aria-label="Needs you">Needs<span class="ck-pill-you"> you</span> <b id="ck-needs-pill-n">0</b></button>
        <div class="indicators">
          <span class="stamp" id="stamp"></span>
          <button id="refresh" type="button">Sync</button>
          <button id="calmbtn" type="button" data-calm-toggle aria-pressed="false" aria-label="Calm off" title="Calm off">Calm off</button>
          <button id="jumpbtn" type="button">Jump<kbd>⌘K</kbd></button>
        </div>
        <div class="themesw" role="group" aria-label="Theme">
          <button type="button" data-theme-set="system" aria-pressed="false" aria-label="Follow the system theme" title="System">&#9680;</button>
          <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">&#9790;</button>
          <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Light theme" title="Light">&#9788;</button>
        </div>
      </div>
      <button id="ck-avatar" class="ck-avatar" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.6"/><path d="M4.8 20c.9-3.6 3.7-5.4 7.2-5.4s6.3 1.8 7.2 5.4"/></svg>
      </button>
    </header>
    <!-- THE ONE NAV: six destinations, one element. A bottom bar under 600px, a rail from 600, a sidebar from 840 (dashboard.css).
         data-dest names the destination; data-mode-tab is the page view it shows (Inbox and Grants have no page of their own yet and
         open the closest view). cockpit_view.js wires the clicks, the keys 1-6 and the address. -->
    <nav class="ck-nav" id="ck-nav" aria-label="Destinations">
      <button type="button" class="ck-dest" data-dest="now" data-mode-tab="morning" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span class="ck-dest-name">Now</span><kbd>1</kbd></button>
      <button type="button" class="ck-dest" data-dest="board" data-mode-tab="board" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="4.6" height="15" rx="1.2"/><rect x="9.7" y="4.5" width="4.6" height="10" rx="1.2"/><rect x="15.9" y="4.5" width="4.6" height="12.5" rx="1.2"/></svg><span class="ck-dest-name">Board</span><kbd>2</kbd></button>
      <button type="button" class="ck-dest" data-dest="inbox" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5l2.4-7.2a1.4 1.4 0 0 1 1.3-1h8.6a1.4 1.4 0 0 1 1.3 1L20 13.5v4.2a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 17.7z"/><path d="M4 13.5h4.4l1 2h5.2l1-2H20"/></svg><span class="ck-dest-name">Inbox</span><kbd>3</kbd></button>
      <button type="button" class="ck-dest" data-dest="grants" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l7 2.6v5.4c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.1z"/><path d="M9 12.2l2.2 2.2L15.2 10"/></svg><span class="ck-dest-name">Grants</span><kbd>4</kbd></button>
      <button type="button" class="ck-dest" data-dest="build" data-mode-tab="build" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.4 5.5l-2.8 13"/></svg><span class="ck-dest-name">Build</span><kbd>5</kbd></button>
      <button type="button" class="ck-dest" data-dest="memory" data-mode-tab="memory" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7.5" ry="2.8"/><path d="M4.5 6.5v5.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6.5M4.5 12v5.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V12"/></svg><span class="ck-dest-name">Memory</span><kbd>6</kbd></button>
    </nav>
    <!-- The narrow page's views, one jump each (drawn only under the stylesheet's 720px break; dashboard_core.js wires the clicks). -->
    <nav class="ck-phonetabs" id="ck-phonetabs" aria-label="Views">
      <button type="button" data-phone-jump="needs">Needs you</button>
      <button type="button" data-phone-jump="board">Board</button>
      <button type="button" data-phone-jump="notes">Notifications</button>
      <button type="button" data-phone-jump="grants">Grants</button>
      <button type="button" data-phone-jump="drop">Drop</button>
    </nav>
    <section class="hero" id="ck-hero" data-ck-region="hero" hidden>
      <div class="band frame" id="ck-band">
        <button id="calmphone" type="button" data-calm-toggle aria-pressed="false">Calm off</button>
        <div class="when" id="ck-when"></div>
        <div class="band-state" id="ck-state-slot"></div>
        <div class="band-meta" id="ck-wrapline"></div>
      </div>
      <div class="skycol frame" id="ck-skycol">
        <div class="skycard" id="ck-skycard">
          <div class="ck-hlens" id="ck-hlens" hidden></div>
          <div id="ck-sky"></div>
          <div class="ck-legend" id="ck-legend" hidden></div>
        </div>
      </div>
    </section>
    <section class="ck-needs frame" id="ck-needs" aria-label="Needs you" hidden></section>
    <!-- The coordinator drop: directly under the Needs-you row in every view (Phill 10-30; filled by renderDropHero; never replaced by an install). -->
    <section class="ck-drop frame" id="ck-drop" aria-label="Drop to the coordinator" hidden></section>
    <section class="ck-notes frame" id="ck-notes" aria-label="Notes from agents" hidden></section>
    <div class="ck-secthead frame" id="ck-h-brief" hidden><h3>Today</h3></div>
    <section class="ck-brief frame" id="ck-brief" data-ck-region="brief" hidden></section>
    <div class="ck-secthead frame" id="ck-h-widgets" hidden><h3>At a glance</h3><span>one answer each</span></div>
    <section class="ck-widgets frame" id="ck-widgets" data-ck-region="widgets" hidden></section>
    <p class="stateline frame" id="state" hidden></p>
    <p class="sub frame" id="store">connecting…</p>
    <!-- The destinations show subsets of the board; the keys 1-6 are ignored while typing. -->
    <main class="frame"><div class="grid" id="board"></div></main>
    <footer class="deck-foot">sovereign · localhost · governed — the substrate, escaped the session</footer>
  </div>

<!-- The canonical render core (shared, transport-agnostic) + this surface's thin
     fetch lifecycle shim. Both served by `levain serve` from package data — no
     CDN, no framework, runs offline. -->
<script src="/card_format.js"></script>
<script src="/dashboard_core.js"></script>
<script src="/sky.js"></script>
<script src="/pair_card.js"></script>
<script src="/dashboard_boot.js"></script>
<script src="/cockpit_stream.js"></script>
<script src="/dashboard_chat.js"></script>
<script src="/devices_panel.js"></script>
<script src="/thread_view.js"></script>
<script src="/board_view.js"></script>
</body>
</html>
