<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Levain · substrate control</title>
<link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="deck">
    <!-- The KE page's regions (hidden until the manifest declares hero / brief / widgets). The masthead below moves
         into the hero's strip, and the state line into the brief, while they are shown. -->
    <section class="hero" id="ck-hero" data-ck-region="hero" hidden>
      <div class="when" id="ck-when"></div>
      <div class="skycol" id="ck-skycol"><div class="tools" id="ck-strip"></div><div id="ck-sky"></div></div>
    </section>
    <div class="ck-legend" id="ck-legend" hidden></div>
    <div class="ck-secthead frame" id="ck-h-brief" hidden><h3>Today</h3></div>
    <section class="ck-brief frame" id="ck-brief" data-ck-region="brief" hidden></section>
    <div class="ck-secthead frame" id="ck-h-widgets" hidden><h3>At a glance</h3><span>one answer each</span></div>
    <section class="ck-widgets frame" id="ck-widgets" data-ck-region="widgets" hidden></section>
    <header class="masthead frame">
      <div class="brand">
        <div class="wordmark">Levain</div>
        <div class="model">your partner's memory, from outside the session</div>
      </div>
      <nav class="seg" aria-label="Modes">
        <button class="mode" type="button" data-mode-tab="morning" aria-selected="false"><kbd>1</kbd>Morning</button>
        <button class="mode" type="button" data-mode-tab="board" aria-selected="true"><kbd>2</kbd>Board</button>
        <button class="mode" type="button" data-mode-tab="build" aria-selected="false"><kbd>3</kbd>Build</button>
      </nav>
      <div class="readout">
        <div class="unit">
          <span class="unit-label">Unit</span>
          <span class="entity" id="entity">—</span>
        </div>
        <div class="jar" id="jar" hidden></div>
        <div class="indicators">
          <span class="stamp" id="stamp"></span>
          <button id="refresh" type="button">Sync</button>
          <button id="jumpbtn" type="button">Jump<kbd>⌘K</kbd></button>
        </div>
      </div>
    </header>
    <p class="stateline frame" id="state" hidden></p>
    <p class="sub frame" id="store">connecting…</p>
    <!-- Modes 1 / 2 / 3 show subsets of the board; the keys are ignored while typing. -->
    <main class="frame"><div class="grid" id="board"></div></main>
    <footer class="deck-foot">sovereign · localhost · governed — the substrate, escaped the session</footer>
  </div>

<!-- The canonical render core (shared, transport-agnostic) + this surface's thin
     fetch lifecycle shim. Both served by `levain serve` from package data — no
     CDN, no framework, runs offline. -->
<script src="/dashboard_core.js"></script>
<script src="/sky.js"></script>
<script src="/cockpit_view.js"></script>
<script src="/dashboard_boot.js"></script>
<script src="/cockpit_stream.js"></script>
<script src="/dashboard_chat.js"></script>
</body>
</html>
