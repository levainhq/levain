<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>levain · consent</title>
<link rel="manifest" id="manifest" href="/app.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e18" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/phone.css">
<link rel="stylesheet" href="/phone_app.css">
</head>
<body>
<header class="top">
  <h1>levain <span class="sub">consent</span></h1>
  <button type="button" id="refresh" class="quiet">refresh</button>
</header>
<section id="stateline" class="stateline" aria-label="state line"></section>
<nav id="tabs" class="tabs" role="tablist" aria-label="views">
  <button type="button" role="tab" id="tab-needs" data-view="needs" aria-selected="true">Needs you</button>
  <button type="button" role="tab" id="tab-board" data-view="board" aria-selected="false">Board</button>
  <button type="button" role="tab" id="tab-notes" data-view="notes" aria-selected="false">Notifications</button>
  <button type="button" role="tab" id="tab-grants" data-view="grants" aria-selected="false">Grants</button>
  <button type="button" role="tab" id="tab-drop" data-view="drop" aria-selected="false">Drop</button>
  <button type="button" role="tab" id="tab-review" data-view="review" aria-selected="false">Review</button>
</nav>
<div id="view-needs">
<p id="status" class="status" role="status">reading the queue…</p>
<main id="requests"></main>
<section id="enrol" class="enrol" hidden>
  <h2>this phone's passkey</h2>
  <p id="enrol-note" class="meta"></p>
  <button type="button" id="enrol-btn">make a passkey here</button>
  <div id="enrol-out"></div>
</section>
</div>
<section id="board" class="view" hidden></section>
<section id="notes" class="view" hidden>
  <div id="pings" class="card pings"></div>
  <div id="record"></div>
</section>
<section id="grants" class="view" hidden>
  <p id="grants-status" class="status" role="status">reading the grants…</p>
  <div id="grants-list"></div>
</section>
<section id="drop" class="view" hidden>
  <div class="card warm drop-sheet">
    <h2>drop to the coordinator</h2>
    <textarea id="drop-words" class="drop-words" rows="4" aria-label="your words to the coordinator"
              placeholder="what you want done; send it and go"></textarea>
    <details id="drop-env" class="drop-env">
      <summary>with an envelope, signed with your passkey</summary>
      <label class="field">where it may work (a repo on the laptop)
        <input id="drop-repo" list="drop-repos" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="/absolute/path/to/repo"></label>
      <datalist id="drop-repos"></datalist>
      <label class="field">land onto (a branch; leave empty for no land)
        <input id="drop-onto" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="main"></label>
      <label class="field">stop after
        <select id="drop-stop"><option>1h</option><option selected>2h</option><option>4h</option><option>8h</option>
          <option>12h</option><option>24h</option></select></label>
      <div class="field-row">
        <label class="field">tool calls <input id="drop-calls" type="number" min="0" inputmode="numeric" placeholder="0"></label>
        <label class="field">tokens <input id="drop-tokens" type="number" min="0" inputmode="numeric" placeholder="0"></label>
        <label class="field">hours <input id="drop-hours" type="number" min="0" inputmode="numeric" placeholder="0"></label>
      </div>
      <div id="drop-review" class="drop-review" hidden></div>
    </details>
    <div class="acts" id="drop-acts">
      <button type="button" id="drop-send" class="go">Send</button>
      <button type="button" id="drop-sign">Review envelope</button>
    </div>
    <div id="drop-note" class="note" role="status"></div>
  </div>
  <div class="panel-head"><h2>outbox</h2><span id="drop-outbox-meta" class="meta"></span></div>
  <div id="drop-outbox"></div>
  <div class="panel-head"><h2>sent from the phone</h2><span id="drop-recent-meta" class="meta"></span></div>
  <div id="drop-recent"></div>
</section>
<section id="review" class="view" hidden>
  <div class="panel-head"><h2>morning card</h2><span id="morning-meta" class="meta"></span></div>
  <div id="morning"></div>
  <div class="panel-head"><h2>review queue</h2><span id="review-meta" class="meta"></span></div>
  <div id="review-list"></div>
  <div class="panel-head"><h2>cleared</h2><span id="review-cleared-meta" class="meta"></span></div>
  <div id="review-cleared"></div>
</section>
<script src="/phone_app.js"></script>
<script src="/card_format.js"></script>
<script src="/phone.js"></script>
</body>
</html>
