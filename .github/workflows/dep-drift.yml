name: dep-drift

# Would the suite still pass if uv.lock were regenerated tonight? The committed lock is what every test run installs
# (scripts/ci_install_locked.sh); this workflow re-resolves in the runner without committing anything, runs the suite on
# that, and on red files ONE issue naming every package whose version changed against the committed lock. The same
# logic runs on a laptop: scripts/dep_drift.py prints a last line `DEP_DRIFT {json}`.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dep-drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift (Python 3.12, upgraded lock)
    # Pinned because ubuntu-latest moved to ubuntu-26.04, whose sudo/bash/python differ; revisit when the tests are made to pass on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Make the runner's container-daemon socket directory readable
        run: sudo chmod o+rx /run/podman || true

      - name: Install h11 for the runner's /usr/bin/python3
        run: sudo /usr/bin/python3 -m pip install --break-system-packages "$(python tests/ci/root_closure.py h11-spec)"

      - name: Install uv
        run: python -m pip install --upgrade pip uv==0.13.5

      - name: Upgrade the lock in a scratch copy, install it, run the suite
        id: drift
        run: |
          set +e
          python scripts/dep_drift.py --python "$(command -v python)" 2>&1 | tee "$RUNNER_TEMP/drift.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          LEVAIN_TEST_WAIT_SCALE: "2"

      - name: File or update the day's issue when it went red
        if: steps.drift.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          title="dependency drift red ${day}"
          line="$(grep '^DEP_DRIFT ' "$RUNNER_TEMP/drift.log" | tail -1 || true)"
          {
            echo "The nightly dep-drift run went red: the suite does not pass on a freshly re-resolved lock."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Result line: \`${line:-none (the script died before printing one)}\`"
            echo
            echo "Packages whose version changed against the committed uv.lock (old -> new):"
            echo
            if [ -n "$line" ]; then
              printf '%s' "${line#DEP_DRIFT }" | python -c 'import json,sys; d=json.load(sys.stdin); print("\n".join("- "+c for c in d["changed"]) or "- none changed (the failure is not a version drift)")'
            else
              echo "- unknown"
            fi
            echo
            echo "Log tail:"
            echo '```'
            tail -n 60 "$RUNNER_TEMP/drift.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh label create drift --color B60205 --description "dependency drift went red" 2>/dev/null || true
          existing="$(gh issue list --state open --label drift --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --label drift --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Fail the run when the drift was red
        if: steps.drift.outputs.code != '0'
        run: exit 1
