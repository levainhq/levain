name: dep-drift

# Would the suite still pass if uv.lock were regenerated tonight? The committed lock is what every test run installs
# (scripts/ci_install_locked.sh); this workflow re-resolves in the runner without committing anything, runs the suite on
# that, and on red keeps ONE open `dep-drift` issue: a comment per red night naming every package whose version
# changed against the committed lock, closed by the first green night. The same logic runs on a laptop: scripts/dep_drift.py prints a last line `DEP_DRIFT {json}`.
#
# Two jobs, on purpose: `drift` runs the suite and `report` files the issue. A reporter step inside the drift job would
# share its timeout, and a step of a job that the timeout is cancelling has no guaranteed budget to run in; a job of its
# own (needs: drift, if: always()) starts after the drift job has ended however it ended.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift (Python 3.12, upgraded lock)
    if: github.repository == 'levainhq/levain'
    # Pinned because ubuntu-latest moved to ubuntu-26.04, whose sudo/bash/python differ; revisit when the tests are made to pass on it.
    runs-on: ubuntu-24.04
    # Not the 60 the sharded jobs get: this one runs the WHOLE suite on one runner, which test.yml's own comment puts at
    # ~55-67 min unsharded, before the install and the re-resolve. A cap under that cancels the job with no result line
    # (the `report` job below still runs after a cancel, and says the job did not finish). Revisit if the suite grows past it.
    timeout-minutes: 120
    outputs:
      # empty exactly when the drift step never finished (a timeout, a cancel or a failed setup step)
      code: ${{ steps.drift.outputs.code }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Make the runner's container-daemon socket directory readable
        run: sudo chmod o+rx /run/podman || true

      - name: Install h11 for the runner's /usr/bin/python3
        # Hash-checked from requirements-ci-root-h11.txt (h11 as uv.lock pins it), never resolved live as root.
        run: sudo /usr/bin/python3 -m pip install --break-system-packages --require-hashes --no-deps -r requirements-ci-root-h11.txt

      - name: Install uv
        # The pins here are the ones scripts/ci_install_locked.sh installs into the drift venv; this step only puts
        # uv on PATH for the re-resolve.
        run: python -m pip install pip==26.3 uv==0.13.5

      - name: Upgrade the lock in a scratch copy, install it, run the suite
        id: drift
        run: |
          set +e
          python scripts/dep_drift.py --python "$(command -v python)" 2>&1 | tee "$RUNNER_TEMP/drift.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          LEVAIN_TEST_WAIT_SCALE: "2"

      - name: Keep the drift log for the reporter
        # Best effort: the reporter is another runner and cannot read this one's disk. On a hard timeout this step may
        # get no time to run, and the reporter then files the issue without a log tail.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drift-log
          path: ${{ runner.temp }}/drift.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Fail the run when the drift was red
        if: always() && steps.drift.outputs.code != '0'
        run: exit 1

  report:
    name: report the night to the dep-drift issue
    needs: drift
    # always(): this job runs whatever became of `drift` (green, red, cancelled by its timeout, a failed setup step).
    # The repository guard is the drift job's own: always() would otherwise also run it on a fork, where drift is skipped.
    # A cancelled run is reported as did-not-finish by design, because `!cancelled()` would also stop the reporter after a timeout-cancel.
    if: ${{ always() && github.repository == 'levainhq/levain' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # issues: write and nothing else: no checkout here, and an artifact of this same run downloads without a token scope.
    permissions:
      issues: write
    steps:
      - name: Fetch the drift log
        # No checkout in this job (it must not depend on the thing that may have failed), so no step needs the repo.
        # A night with no saved log is still reported, which is why a failed download is not a failure.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: drift-log
          path: ${{ runner.temp }}/drift-log

      - name: File, update or close the one dep-drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout means no git remote, and gh reads GH_REPO (not GITHUB_REPOSITORY) when it has none.
          GH_REPO: ${{ github.repository }}
          # DRIFT_CODE is empty exactly when the drift step never wrote its exit code; JOB_STATUS is how that job ended.
          DRIFT_CODE: ${{ needs.drift.outputs.code }}
          JOB_STATUS: ${{ needs.drift.result }}
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          title="dependency drift red"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create dep-drift --color B60205 --description "dependency drift went red" 2>/dev/null || true
          existing="$(gh issue list --state open --label dep-drift --json number --jq '.[0].number // empty')"
          if [ "$DRIFT_CODE" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Green on ${day}: the suite passes on a freshly re-resolved lock. ${run_url}"
            fi
            exit 0
          fi
          log="$RUNNER_TEMP/drift-log/drift.log"
          if [ ! -f "$log" ]; then
            mkdir -p "$RUNNER_TEMP/drift-log"
            : > "$log"
          fi
          # The body is built by one script that prints nothing until the whole body exists, and that bounds every part of it:
          # GitHub rejects an issue or comment body over 65,536 characters (HTTP 422), and the step would then end red with no issue.
          render="$RUNNER_TEMP/render_body.py"
          cat > "$render" <<'PY'
          import json
          import os
          import sys

          BODY_MAX = 60000      # characters in the whole body; GitHub refuses 65,536, so this stays well under it
          LINE_MAX = 500        # the result line as shown in the body
          ITEM_MAX = 400        # one package or one failing test
          LIST_MAX = 15000      # one bulleted list (changed packages, failing tests)
          TAIL_LINES = 60       # log lines kept at the end
          TAIL_LINE_MAX = 800   # characters kept of one of those lines
          MARK = "(truncated)"  # the last line of the body when anything was cut

          day, run_url, log_path = sys.argv[1:4]
          code = os.environ.get("DRIFT_CODE", "")
          status = os.environ.get("JOB_STATUS", "") or "unknown"
          cut = False


          def clip(text, limit):
              global cut
              if len(text) > limit:
                  cut = True
                  return text[:limit]
              return text


          def longest_backtick_run(text):
              best = run = 0
              for ch in text:
                  run = run + 1 if ch == "`" else 0
                  best = max(best, run)
              return best


          def bullets(seq):
              global cut
              lines, used = [], 0
              for i, c in enumerate(seq):
                  b = "- " + clip(str(c).replace("\r", " ").replace("\n", " "), ITEM_MAX)
                  if used + len(b) + 1 > LIST_MAX:
                      lines.append("- ... and %d more" % (len(seq) - i))
                      cut = True
                      break
                  lines.append(b)
                  used += len(b) + 1
              return "\n".join(lines)


          def section(payload):
              """What the result line says, as text; nothing is printed from here, so a failure leaves no half section."""
              try:
                  d = json.loads(payload)
              except Exception:  # ValueError, and RecursionError from a deeply nested line
                  d = None
              out = []
              changed = d.get("changed") if isinstance(d, dict) else None
              if not isinstance(changed, list):
                  out.append("The result line could not be read (it is not a JSON object with a list under changed); the log tail below is the evidence.\n")
              elif changed:
                  out.append("Packages whose version changed against the committed uv.lock (old -> new):\n\n")
                  out.append(bullets(changed) + "\n")
              elif d.get("stage") == "suite":
                  out.append("red with no version change: likely flaky test, not drift\n")
              else:
                  out.append("no version change recorded; result: " + clip(str(d.get("result")), ITEM_MAX) + ", stage: " + clip(str(d.get("stage")), ITEM_MAX) + "\n")
              failed = d.get("failed_tests") if isinstance(d, dict) else None
              if failed and isinstance(failed, list):
                  out.append("\nFailing tests:\n\n")
                  out.append(bullets(failed) + "\n")
              return "".join(out)


          with open(log_path, "rb") as fh:
              log_lines = fh.read().decode("utf-8", "replace").split("\n")
          if log_lines and log_lines[-1] == "":
              log_lines.pop()
          marked = [ln for ln in log_lines if ln.startswith("DEP_DRIFT ")]
          line = marked[-1] if marked else None

          if code == "":
              head = ("Did not finish on %s: the job ended (job status: %s) before the drift check wrote an exit code.\n"
                      "That is a timeout, a cancel or a failed setup step. It says nothing about whether the dependencies drifted.\n" % (day, status))
          else:
              head = "Red on %s: the suite does not pass on a freshly re-resolved lock.\n" % day

          # The result line sits in an inline code span: its delimiter is one backtick longer than the longest run inside it.
          shown = clip(line, LINE_MAX) if line is not None else "none (the script died before printing one)"
          span = "`" * (longest_backtick_run(shown) + 1)
          pad = " " if shown.startswith("`") or shown.endswith("`") else ""
          # Anything this script cannot foresee ends it with a non-zero status before it has written a byte, and the shell below files the fallback body.
          text = section(line[len("DEP_DRIFT "):]) if line is not None else "Packages whose version changed: unknown.\n"
          prefix = "%s\nRun: %s\n\nResult line: %s%s%s%s%s\n\n%s\nLog tail:\n" % (head, run_url, span, pad, shown, pad, span, text)

          # The tail takes what is left of BODY_MAX (room kept for both fences and the marker), newest lines first.
          budget = BODY_MAX - len(prefix) - 2 * (TAIL_LINE_MAX + 2) - len(MARK) - 4
          kept, used = [], 0
          if len(log_lines) > TAIL_LINES:  # the slice below drops the oldest whole lines, and a body that lost lines says so
              cut = True
          for ln in reversed([clip(ln, TAIL_LINE_MAX) for ln in log_lines[-TAIL_LINES:]]):
              if used + len(ln) + 1 > budget:
                  cut = True
                  break
              kept.insert(0, ln)
              used += len(ln) + 1
          fence = "`" * max(3, longest_backtick_run("\n".join(kept)) + 1)
          body = prefix + fence + "\n" + "".join(ln + "\n" for ln in kept) + fence + "\n" + (MARK + "\n" if cut else "")
          sys.stdout.buffer.write(body.encode("utf-8", "replace"))
          PY
          if ! python3 "$render" "$day" "$run_url" "$log" > "$RUNNER_TEMP/body.md"; then
            {
              echo "Dependency drift did not pass on ${day}; the report could not be rendered. Run: ${run_url}"
              echo
              echo "The result line could not be read (the parser failed); the log tail below is the evidence."
              echo
              echo "Log tail:"
              echo '```'
              tail -n 60 "$log" | cut -c1-400 | tr -d '`' | tail -c 20000 || true
              echo '```'
            } > "$RUNNER_TEMP/body.md"
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --label dep-drift --body-file "$RUNNER_TEMP/body.md"
          fi
