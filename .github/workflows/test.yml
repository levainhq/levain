# DIAGNOSTIC ONLY (levain#157 W x #138 localisation, levain-speed 6): runs the three browser tests that failed on the W2 link,
# repeatedly and under xdist, so a bisect cycle is minutes. Lives on diag branches only; never lands.
name: test
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "how many times the three tests run"
        default: "4"
      workers:
        description: "xdist workers"
        default: "3"

permissions:
  contents: read

jobs:
  diag:
    name: diag browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: "156.0.8078.47"

      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install package
        run: |
          scripts/ci_install_locked.sh dev openhands

      - name: Run the three tests, repeatedly
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          LEVAIN_TEST_WAIT_SCALE: "2"
          ROUNDS: ${{ inputs.rounds }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set +e
          rc=0
          for i in $(seq 1 "$ROUNDS"); do
            echo "=== round $i"
            pytest -n "$WORKERS" -q -rf --basetemp=/tmp/levain-pt-$i \
              tests/test_cockpit_k10_keep.py \
              tests/test_cockpit_flip_parity.py::test_a_send_that_throws_leaves_the_keep_and_agenda_forms_with_a_fixed_line_and_live_buttons \
              tests/test_list_page_browser.py::test_lpr3_the_cards_one_control_is_drawn_once_and_not_redrawn_by_its_own_layout \
              2>&1 | tail -12
            [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
          done
          exit $rc
