name: test

# Minimal CI: the full pytest suite on Ubuntu. Tests that need macOS sandbox-exec,
# a live Ollama, or the Linux image (LEVAIN_REQUIRE_LINUX_LIVE) skip themselves
# where those are absent; a skip is not a pass, so read the skip count in the log.

on:
  push:
    branches: [main, "seat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        # hatchling is a build dependency the packaging tests ask for directly.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" hatchling

      - name: Run pytest
        run: pytest -q
