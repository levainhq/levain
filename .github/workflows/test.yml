name: test

# Minimal CI: the full pytest suite on Ubuntu. Tests that need macOS sandbox-exec,
# a live Ollama, or the Linux image (LEVAIN_REQUIRE_LINUX_LIVE) skip themselves
# where those are absent; a skip is not a pass, so read the skip count in the log.

on:
  push:
    branches: [main, "seat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Raised from 40 on 10-21: green runs had reached 29-37 min and two land branches were cut at the cap
    # mid-suite (not hung). A hang still ends here; splitting the suite is the durable fix.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Make the runner's container-daemon socket directory readable
        # The Linux floor refuses a crown jewel this user cannot stat (a hardlink could reach it;
        # the refusal tells the operator to make it readable or remove it from the floor). The
        # runner image ships a rootful podman whose /run/podman is root-only, so every floor test
        # would refuse on a host the tests do not model. This applies the refusal's own remedy.
        run: sudo chmod o+rx /run/podman || true

      - name: Install package with dev and openhands extras
        # hatchling is a build dependency the packaging tests ask for directly; the openhands
        # extra is imported by the floor tests (tests/test_floor_project_memory.py).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openhands]" hatchling

      - name: Run pytest
        run: pytest -q

  linux-live:
    # The bwrap floor RUN, not read as data. GitHub's ubuntu runners refuse unprivileged user
    # namespaces through AppArmor by default, so the `linux_live` tests skip in the job above.
    # This job lifts that restriction on the runner VM itself, which is the documented remedy the
    # refusal names, and then requires the live tests to run (LEVAIN_REQUIRE_LINUX_LIVE=1 fails a
    # skip). It runs the floor test files only.
    name: bwrap floor live (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bubblewrap and allow it a user namespace
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 update -q || true
          sudo timeout 300 apt-get -o Acquire::Retries=3 install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --bind / / --proc /proc --dev /dev --unshare-pid /bin/true && echo "bwrap ok"
          # Each command runs in a cgroup leaf of the runner user's systemd user manager; a runner has no
          # login session, so linger starts that manager (what `sudo levain setup-isolation` does).
          sudo loginctl enable-linger "$(id -un)"
          for i in $(seq 1 50); do test -d "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service" && test -S "/run/user/$(id -u)/bus" && break; sleep 0.2; done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --scope --quiet --collect /bin/true && echo "user scope ok"

      - name: Make the runner's container-daemon socket directory readable
        run: sudo chmod o+rx /run/podman || true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openhands]" hatchling

      - name: Run the live floor tests
        env:
          LEVAIN_REQUIRE_LINUX_LIVE: "1"
        run: >
          pytest -q -rs tests/test_firing_confinement.py tests/test_jewel_recheck.py
          tests/test_nlink_floor.py tests/test_masks_last.py tests/test_floor_project_memory.py
          tests/test_floor_spellings.py tests/test_floor_cloud_creds.py tests/test_floor_process_view.py
          tests/test_hands_spawn.py::test_the_operator_floor_kills_its_leaf_when_levain_dies
          tests/test_runtime_view.py tests/test_floor_autonomic_store.py tests/test_landlock_live.py tests/test_landlock.py

  browser:
    # The cockpit browser tests RUN, not skipped. They carry a skipif (`needs_browser`) whose default Chrome
    # is the macOS app bundle, so in the `test` job every one of them skips. Here Chrome is installed at a
    # pinned version and CHROME points at it. Selection is by file (every test file that names
    # `needs_browser`), because the mark is a skipif and not a registered marker, so `-m` cannot pick it.
    # The job fails if that selection is empty, if nothing was collected, or if ANY test skips for the
    # missing browser.
    name: cockpit browser tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable

      - name: Let Chrome use its sandbox
        # The runner's AppArmor refuses the unprivileged user namespace Chrome's sandbox needs, and the
        # page driver's flags (tests/chrome_flags.json) do not pass --no-sandbox. This lifts the
        # restriction on the throwaway runner VM, the same remedy the linux-live job applies for bwrap.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openhands]" hatchling

      - name: Run the browser tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          echo "Chrome: $CHROME"
          "$CHROME" --version
          node --version
          files=$(grep -l needs_browser tests/*.py | sort)
          echo "$files"
          test -n "$files" || { echo "no test file names needs_browser"; exit 1; }
          set -o pipefail
          pytest -q -rs $files 2>&1 | tee browser.log
          # a skipped browser test is a failure here: the whole point of this job is that they run
          if grep -q "node and Chrome are needed" browser.log; then
            echo "browser tests skipped for a missing node or Chrome"
            exit 1
          fi

  isolation:
    # `levain setup-isolation` for real: create the hands user, check the uid gate, undo. Only on
    # throwaway runners (passwordless sudo); this is the only place the Linux setup is exercised.
    name: setup-isolation e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install the ACL tools (Linux)
        if: runner.os == 'Linux'
        run: command -v setfacl || (sudo apt-get update && sudo apt-get install -y acl)

      - name: Set up, check and undo isolation
        run: bash tests/ci/isolation_e2e.sh
